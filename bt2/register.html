<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Registration</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #fff;
            width: 520px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        h2 {
            margin-top: 0;
            color: #222;
            margin-bottom: 25px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            font-size: 13px;
            font-weight: bold;
            color: #444;
            margin-bottom: 6px;
        }
        .form-group input {
            padding: 9px 12px;
            border: 1px solid #c084fc;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
        }
        .gender-section {
            margin-top: 20px;
        }
        .gender-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #444;
        }
        .gender-options {
            display: flex;
            gap: 25px;
            font-size: 14px;
            color: #555;
        }
        .btn-register {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: linear-gradient(to right, #6366f1, #a855f7);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-register:hover {
            opacity: 0.95;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Registration</h2>
    <form action="bt2.php" method="POST">
        <div class="form-grid">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="fullname" placeholder="Nguyen Nhat Khanh Duy" required>
            </div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Duy" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="duy123@gmail.com" required>
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" name="phone" placeholder="0123456789" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password" required>
            </div>
        </div>

        <div class="gender-section">
            <div class="gender-title">Gender</div>
            <div class="gender-options">
                <label><input type="radio" name="gender" value="Male" checked> Male</label>
                <label><input type="radio" name="gender" value="Female"> Female</label>
                <label><input type="radio" name="gender" value="Prefer not to say"> Prefer not to say</label>
            </div>
        </div>

        <button type="submit" class="btn-register">Register</button>
    </form>
</div>

</body>
</html>
